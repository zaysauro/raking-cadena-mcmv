<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking MCMV · Cadena</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif}body{color:#252525;background:#e84922 url('/cadena-fundo.jpg') center/cover fixed no-repeat}main{width:min(98%,1760px);margin:auto;min-height:100dvh;padding:13px 10px 16px;display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:150px;max-height:58px;object-fit:contain;background:#fff;border-radius:8px;padding:7px;box-shadow:0 6px 16px #641d1740}.controls{display:flex;align-items:center;gap:9px}.period{background:#fff;color:#bd3d25;font-size:clamp(11px,1.1vw,16px);font-weight:800;padding:10px 15px;border-radius:9px;box-shadow:0 5px 15px #671c1740}.controls button{border:0;background:#fff;border-radius:8px;padding:9px 13px;font-size:21px;cursor:pointer;box-shadow:0 5px 15px #671c1740}.screen{display:none;flex:1;flex-direction:column;justify-content:center;gap:13px;animation:appear .7s ease}.screen.active{display:flex}@keyframes appear{from{opacity:.1;transform:translateY(9px)}to{opacity:1;transform:none}}h1{color:#fff;text-align:center;font-size:clamp(27px,3vw,47px);margin:0;text-shadow:0 3px 9px #72241960}h2{color:#fff;font-size:clamp(19px,2vw,31px);margin:0 0 9px;text-shadow:0 3px 9px #72241960}.podium{display:grid;grid-template-columns:1fr 1.13fr 1fr;align-items:end;gap:16px;max-width:1540px;width:100%;margin:0 auto}.card{--medal:#b2b4b9;--light:#e3e4e7;--line:#adb0b7;min-width:0;background:#fff;border-top:7px solid var(--medal);border-radius:16px;padding:18px 14px 15px;text-align:center;box-shadow:0 12px 29px #601b1650;display:flex;flex-direction:column;justify-content:flex-end}.card.first{--medal:#d7a62e;--light:#fff0be;--line:#e4bc53;min-height:clamp(360px,48vh,540px)}.card.second{min-height:clamp(320px,43vh,485px)}.card.third{--medal:#b77b56;--light:#f2d6c5;--line:#bf8c6b;min-height:clamp(285px,38vh,435px)}.place{font-size:clamp(13px,1.2vw,20px);font-weight:800;color:#9f3923}.avatar{height:clamp(95px,13vh,148px);width:clamp(95px,13vh,148px);border-radius:50%;border:5px solid var(--medal);background:#f1f1f1;box-shadow:0 5px 14px #0003;margin:13px auto;display:grid;place-items:center;font-size:36px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.card.first .avatar{width:clamp(170px,22vh,250px);height:clamp(170px,22vh,250px)}.card.second .avatar{width:clamp(130px,17vh,190px);height:clamp(130px,17vh,190px)}.name{font-size:clamp(17px,1.9vw,29px);font-weight:800;color:#111;margin:3px 0 16px;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.metric{background:var(--light);border:1px solid var(--line);border-radius:9px;padding:14px 3px;box-shadow:0 5px 10px #0002}.metric strong{display:block;font-size:clamp(22px,2.3vw,40px)}.metric span{display:flex;align-items:center;justify-content:center;min-height:2.3em;padding:0 1px;font-size:clamp(8px,.72vw,11px);line-height:1.15;font-weight:700;overflow-wrap:anywhere;word-break:normal}.metric:last-child span{white-space:nowrap;font-size:clamp(7px,.58vw,9px);letter-spacing:-.04em}.metric:first-child strong{color:#c33920}.challenges{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:13px;max-width:1500px;width:100%;margin:0 auto}.challenges>.challenge{flex:0 1 calc((100% - 26px)/3)}.challenge{background:linear-gradient(155deg,#fff 60%,#fff2e9);border-top:5px solid #e04125;box-shadow:0 10px 23px #631e1750;border-radius:14px;padding:12px 14px;min-width:0}.challenge .head{display:flex;align-items:center;gap:9px}.challenge .initial{width:52px;height:52px;flex:0 0 52px;background:#ffe7db;color:#af2e1b;border-radius:50%;display:grid :none!important}.presence .kicker{font-size:11px;font-weight:800;letter-spacing:.08em;color:#b03721}.presence h3{margin:0;font-size:clamp(16px,1.3vw,22px);font-weight:800;color:#111}.presence .qr{background:#fff;border:1px solid #f0d9cf;border-radius:10px;padding:6px;aspect-ratio:1/1}.presence .qr img{display:block;width:100%;height:auto;image-rendering:pixelated}.presence .hint{font-size:clamp(10px,.8vw,13px);color:#555;font-weight:600;line-height:1.3}.presence .until{font-size:clamp(11px,.85vw,14px);font-weight:800;color:#252525}.presence .count{font-size:clamp(12px,.95vw,15px);font-weight:800;color:#a52c1b;border-top:1px solid #eadbd4;padding-top:7px}.presence ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:0;overflow:hidden}.presence li{display:flex;align-items:center;gap:7px;font-size:clamp(11px,.85vw,14px);font-weight:700;white-space:nowrap}.presence li span{flex:1;overflow:hidden;text-overflow:ellipsis}.presence li small{color:#777;font-weight:700}.presence li i{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:#339646}.presence li.paused i{background:#ffc52e}.presence li.checked_out i{background:#aaa}.presence li b{flex:0 0 18px;font-size:11px;color:#a52c1b;text-align:right}.presence li.turn-reset{flex-direction:column;justify-content:center;gap:4px;white-space:normal;text-align:center;padding:16px 10px;border-radius:10px;background:#fff1eb;border:2px solid #e84922;animation:turnPulse 2.4s ease-in-out infinite}.presence li.turn-reset strong{font-size:clamp(16px,1.4vw,24px);font-weight:800;color:#b03721}.presence li.turn-reset span{font-size:clamp(12px,1vw,16px);font-weight:700;color:#3a2a25}.presence.is-turn-reset{border-top-color:#e84922}@keyframes turnPulse{50%{box-shadow:0 0 0 6px #e8492226}}@media (prefers-reduced-motion:reduce){.presence li.turn-reset{animation:none}}.presence li.empty{justify-content:center;color:#777;font-weight:600}.presence .msg{font-size:12px;font-weight:700;c </style></head><body><main><header><img src="/cadena-logo.png" class="logo" alt="Cadena Imóveis"><div class="controls"><span class="period" id="month">Ranking do mês</span><button id="next" title="Próxima tela">⇄</button><button id="refresh" title="Recarregar">↻</button><button id="fullscreen" title="Tela cheia">⛶</button></div></header><div id="notice" class="notice"></div><section class="screen active" id="ranking"><h1>Ranking MCMV - Out. 2026</h1><div class="podium" id="podium"></div></section><section class="screen" id="okrs"><h1>Desafios da equipe · Semana atual</h1><div class="challenges" id="challenges"></div><h2>Resultado acumulado · Equipe MCMV</h2><div class="totals" id="totals"></div></section><div class="progress"><i id="progress"></i></div><footer class="foot" id="status">Consultando Amparo…</footer></main><aside id="presence" class="presence" hidden aria-label="Presença do turno"><div class="kicker">ROLETA · PRESENÇA DO TURNO</div><h3>Registre sua chegada</h3><div class="qr" hidden><img alt="QR Code de presença do Amparo"></div><div class="hint">Leia com o Amparo ou a câmera do celular</div><div class="until" data-until></div><div class="count" data-count></div><ul></ul><div class="msg" hidden></div></aside><script src="/presence.js" defer></script><script>const monthLabel=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric',timeZone:'America/Sao_Paulo'}).format(new Date());document.getElementById('month').textContent='Ranking do mês · '+monthLabel;const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const key=s=>{let v=norm(s);if(v.includes('kauan'))return 'kauan';if(v.includes('jhonattan'))return 'jhonattan';if(v.includes('tiago'))return 'tiago';if(v.includes('rodrigo'))return 'rodrigo';if(v.includes('yang'))return 'yang';if(v.includes('luiz')||v.includes('luis'))return 'luiz';if(v.includes('marcelo'))return 'marcelo';return v};const display=s=>key(s)==='kauan'?'Kauan Pereira':s;const n=v=>Number(v)||0;const pics={jhonattan:'/photos/Jhonattan-Paes.jpg',tiago:'/photos/Tiago-Silva.jpg',kauan:'/photos/Kauan-Pereira.jpg',luiz:'/photos/Luiz-Fernando.jpg',yang:'/photos/Yang-Souza.jpg'};const photoAliases={'jhonattan paes':'jhonattan','jhonattan':'jhonattan','tiago silva':'tiago','tiago':'tiago','kauan pereira':'kauan','kauan':'kauan','luiz fernando':'luiz','luis fernando':'luiz','luiz':'luiz','luis':'luiz','yang souza':'yang','yang':'yang'};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function pic(name){let normalized=norm(name).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();let k=photoAliases[normalized]||key(name);let ini=display(name).split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();let src=pics[k];return src?'<img src="'+src+'" alt="'+safe(display(name))+'" loading="eager" decoding="async" onerror="this.replaceWith(document.createTextNode(\''+ini+'\'))">':ini}function medalLevel(sales){return Math.min(3,Math.max(0,Math.floor(Number(sales)||0)))}function medalImage(sales,cls){let level=medalLevel(sales);return level?'<img class="'+cls+'" src="/medal-'+level+'.png" alt="Medalha nível '+level+'" title="'+sales+' venda(s) · nível '+level+'">':''}let salesByKey={};function card(x,i){let cls=['first','second','third'][i];return '<article class="card '+cls+'"><div class="place">'+(i+1)+'º LUGAR</div><div class="avatar-wrap"><div class="avatar">'+pic(x.name)+'</div>'+medalImage(x.sales,'sale-medal')+'</div><div class="name">'+safe(display(x.name))+'</div><div class="metrics">'+[['sales','Vendas'],['proposals','Propostas'],['folders','Pastas'],['appointments','Agendamentos']].map(([k,l])=>'<div class="metric"><strong>'+n(x[k])+'</strong><span>'+l+'</span></div>').join('')+'</div></article>'}let screen=0;let barsAnimated=false;function animateBars(){if(screen!==1)return;barsAnimated=true;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#challenges .fill').forEach(el=>el.style.width=el.dataset.percent+'%')))}function show(i){screen=i;document.querySelectorAll('.screen').forEach((e,j)=>e.classList.toggle('active',j===i));let bar=document.querySelector('#progress');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='progress 180s linear infinite';if(i===1)animateBars()}setInterval(()=>show((screen+1)%2),180000);document.querySelector('#next').onclick=()=>show((screen+1)%2);document.querySelector('#refresh').onclick=()=>location.reload();document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();let lastMonth=monthLabel;setInterval(()=>{let now=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric',timeZone:'America/Sao_Paulo'}).format(new Date());if(now!==lastMonth)location.reload()},60000);setInterval(()=>{if(!document.hidden)load()},60000);setInterval(()=>location.reload(),1800000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('focus',()=>load());async function get(url){let r=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});let d=await r.json();if(!r.ok||d.error)throw Error(d.error||'HTTP '+r.status+' · '+url);return d}function mission(x){let valid=Number.isFinite(x.current)&&Number.isFinite(x.target)&&x.target>0;let target=Number.isFinite(x.target)&&x.target>0?Math.ceil(x.target):0;let current=Number.isFinite(x.current)?Math.max(0,x.current):0;let pct=valid?Math.min(100,Math.round(current/x.target*100)):0;let tone=pct<=33.333?'#e34132':pct<=66.666?'#ffc52e':'#339646';let slots=target||10;let blocks=Array.from({length:slots},(_,i)=>{let portion=valid?Math.max(0,Math.min(100,(current-i)*100)):0;return '<span class="segment"><span class="fill" data-percent="'+portion.toFixed(2)+'" style="display:block;--status-color:'+tone+';width:'+(barsAnimated?portion.toFixed(2):'0')+'%"></span></span>'}).join('');return '<div class="mission"><div class="missiontop"><span>'+safe(x.label)+'</span><b>'+(valid?current+' / '+target:current+' · sem meta')+'</b></div><div class="track" role="progressbar" aria-label="'+safe(x.label)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'">'+blocks+'</div><div class="missionnote">'+(valid?pct+'% · Semana atual':'Meta não definida · Semana atual')+'</div></div>'}function challenge(x){let initials=display(x.name).split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();let m=x.missions||[];let measured=m.filter(x=>Number.isFinite(x.current)&&Number.isFinite(x.target)&&x.target>0);let completed=measured.length&&measured.every(x=>x.current>=x.target);return '<article class="challenge">'+medalImage(salesByKey[key(x.name)]||0,'sale-medal-bg')+'<div class="head"><div class="initial">'+pic(x.name)+'</div><div><div class="person">'+safe(display(x.name))+'</div><div class="level">'+(completed?'META CONCLUÍDA':'MISSÕES SEMANAIS')+'</div></div></div>'+m.map(mission).join('')+'</article>'}function fitGoalCards(){const grid=document.querySelector('#challenges');if(!grid)return;const count=grid.children.length||1;const width=window.innerWidth||document.documentElement.clientWidth;let maxCols=width>1500?5:width>1050?4:width>760?3:2;let cols=count<=3?Math.min(3,maxCols):count<=8?Math.min(4,maxCols):Math.min(5,maxCols);cols=Math.max(1,Math.min(cols,count));grid.style.setProperty('--goal-cols',String(cols));grid.style.setProperty('--goal-rows',String(Math.ceil(count/cols)));}window.addEventListener('resize',fitGoalCards);let fetching=false;async function load(){if(fetching)return;fetching=true;try{let d=await get('/api/ranking');let ops={goals:(d.operations&&d.operations.goals)||[]};let people=(d.ranking||[]).filter(x=>key(x.name)!=='marcelo').map(x=>({name:x.name,sales:n(x.vendas),proposals:n(x.propostas),folders:n(x.pastas),appointments:n(x.agendamentos)})).sort((a,b)=>n(b.sales)-n(a.sales)||n(b.proposals)-n(a.proposals)||n(b.folders)-n(a.folders)||n(b.appointments)-n(a.appointments)||String(a.name).localeCompare(String(b.name),'pt-BR'));salesByKey=Object.fromEntries(people.map(p=>[key(p.name),p.sales]));document.querySelector('#podium').innerHTML=[1,0,2].filter(i=>people[i]).map(i=>card(people[i],i)).join('')||'<article class="card">Nenhum dado de ranking encontrado</article>';let totals={sales:0,proposals:0,folders:0,appointments:0};for(const x of people)for(const k of Object.keys(totals))totals[k]+=n(x[k]);document.querySelector('#totals').innerHTML=[['sales','Vendas'],['proposals','Propostas'],['folders','Pastas'],['appointments','Agendamentos']].map(([k,l])=>'<div class="total"><strong>'+totals[k]+'</strong><span>'+l+'</span></div>').join('');const weeklyGoals=((ops&&ops.goals)||[]).filter(g=>people.some(p=>key(p.name)===key(g.name)));document.querySelector('#challenges').innerHTML=weeklyGoals.map(challenge).join('')||'<article class="challenge">Nenhum corretor ativo encontrado</article>';fitGoalCards();if(screen===1)animateBars();let warn=(d.warnings||[]).slice();if(d.stale)warn.unshift('Exibindo os últimos dados confirmados');let notice=document.querySelector('#notice');if(warn.length){notice.style.display='block';notice.textContent=warn.join(' · ')}else notice.style.display='none';document.querySelector('#status').textContent='Amparo sincronizado · '+new Date(d.updatedAt).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · Consulta automática a cada 60 s'+(d.complete===false?' · dados parciais':'')}catch(e){document.querySelector('#notice').style.display='block';document.querySelector('#notice').textContent='Erro de atualização: '+e.message;document.querySelector('#status').textContent='Falha de sincronização; não exibir valores antigos como atuais'}finally{fetching=false}}load();const keepalive=document.getElementById('tv-keepalive');function startKeepalive(){if(keepalive&&keepalive.paused)keepalive.play().catch(()=>{});}startKeepalive();document.addEventListener('visibilitychange',()=>{if(!document.hidden)startKeepalive()}
